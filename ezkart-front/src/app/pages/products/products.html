<form [formGroup]="form" (ngSubmit)="buscar()" class="flex flex-wrap items-start gap-2 mb-4">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Código</mat-label>
    <input matInput formControlName="codigo" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Precio máximo</mat-label>
    <input matInput type="number" min="0" formControlName="precio" />
  </mat-form-field>

  <button mat-flat-button type="submit" class="mt-1">Buscar</button>
  <button mat-button type="button" (click)="limpiar()" class="mt-1">Limpiar</button>
</form>

@if (datos(); as d) {
  <div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(220px,1fr))]">
    @for (p of d.items; track p.id) {
      <app-producto-card [producto]="p" />
    } @empty {
      <p>No hay productos.</p>
    }
  </div>

  <mat-paginator
    [length]="d.totalItems"
    [pageSize]="d.tamanoPagina"
    [pageIndex]="d.pagina - 1"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="cambiarPagina($event)"
  />
}
