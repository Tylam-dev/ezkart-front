<a mat-button routerLink="/products">← Volver</a>

@if (producto(); as p) {
  <h1 class="text-2xl font-medium mt-4">{{ p.nombre }}</h1>

  <dl class="mt-4 grid grid-cols-[max-content_1fr] gap-x-4 gap-y-2">
    <dt class="font-medium">Código</dt>
    <dd>{{ p.codigo }}</dd>

    <dt class="font-medium">Precio</dt>
    <dd>{{ p.precio | currency }}</dd>

    <dt class="font-medium">Existencia</dt>
    <dd>{{ p.existencia }}</dd>
  </dl>
} @else if (noEncontrado()) {
  <p class="mt-4">Producto no encontrado.</p>
}
