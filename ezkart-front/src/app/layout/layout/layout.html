<mat-toolbar class="flex justify-between">
  <div class="flex items-center gap-2">
    <button mat-icon-button (click)="cerrarSesion()" aria-label="Cerrar sesión">
      <mat-icon>logout</mat-icon>
    </button>

    <span>{{ auth.usuario()?.nombre }}</span>
  </div>

  <button
    mat-icon-button
    [matMenuTriggerFor]="menuCarrito"
    (menuOpened)="cargarCarrito()"
    aria-label="Carrito"
  >
    <mat-icon>shopping_cart</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #menuCarrito="matMenu">
  <div class="px-4 py-2 min-w-64">
    @for (item of carrito.carrito()?.items ?? []; track item.productoId) {
      <div class="flex items-center justify-between gap-4 py-1">
        <span>
          {{ item.nombre }}
          @if (item.agotado) {
            <span class="text-red-600 text-xs">(Agotado)</span>
          }
        </span>
        <span class="flex items-center">
          x{{ item.cantidad }}
          <button
            mat-icon-button
            (click)="$event.stopPropagation(); eliminarDelCarrito(item.productoId)"
            aria-label="Quitar del carrito"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </span>
      </div>
    } @empty {
      <p>El carrito está vacío.</p>
    }
  </div>
</mat-menu>

<main class="p-4">
  <router-outlet />
</main>
